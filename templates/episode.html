<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Naruto - Епизод {{ episode }}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="logo">Anime BG</div>

    <nav>
        <a href="/">Начало</a>
        <a href="/naruto">Naruto</a>
    </nav>
</header>

<main class="player-page">

    <h1>Naruto — Епизод {{ episode }}</h1>

    <iframe
        class="anime-player"
        src="https://vioo.cc/embed/{{ video_id }}"
        width="100%"
        height="500"
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
    </iframe>

    <a href="/naruto" class="back-button">
        ← Назад към епизодите
    </a>

</main>

</body>
</html>
